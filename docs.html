<!doctype html>
<html lang="en" data-root="wychwood">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wychwood Icons</title>
<link rel="stylesheet" href="/catalog.css">
</head>
<body>
<header>
  <button id="toggle" type="button">Folders</button>
  <h1>Wychwood Icons<span id="total"></span></h1>
  <input id="q" type="search" placeholder="Search: ahsap, adamotu olgun, aguamenti…" autocomplete="off">
  <a class="contact" href="https://discord.com/users/317004664002576386" target="_blank" rel="noopener">Contact me: <b>denizwp</b></a>
</header>
<div class="wrap">
  <aside><ul id="tree"></ul></aside>
  <main>
    <div class="bar"><div class="crumbs" id="crumbs"></div><span class="count" id="count"></span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No results.</div>
    <div id="more"></div>
  </main>
</div>
<dialog id="dlg">
  <div class="dlg">
    <div class="dlg-top">
      <h2 id="d-title"></h2>
      <button class="icon-btn" id="d-prev" type="button" aria-label="Previous" title="Previous (←)">&#8592;</button>
      <button class="icon-btn" id="d-next" type="button" aria-label="Next" title="Next (→)">&#8594;</button>
      <button class="icon-btn" id="d-close" type="button" aria-label="Close" title="Close (Esc)">&#10005;</button>
    </div>
    <div class="stage"><img id="d-img" alt=""><span class="dim" id="d-dim"></span></div>
    <div class="rows">
      <div class="row"><label for="d-url">URL</label><input id="d-url" readonly><button type="button" data-copy="d-url">Copy</button></div>
      <div class="row"><label for="d-path">Path</label><input id="d-path" readonly><button type="button" data-copy="d-path">Copy</button></div>
      <div class="row"><label for="d-name">Name</label><input id="d-name" readonly><button type="button" data-copy="d-name">Copy</button></div>
    </div>
    <div class="dlg-foot"><span id="d-pos"></span><a id="d-open" target="_blank" rel="noopener">Open in new tab</a></div>
  </div>
</dialog>
<script src="/catalog.js"></script>
</body>
</html>
