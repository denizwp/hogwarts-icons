<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon Catalog</title>
<meta name="description" content="Icons for Hogwarts Legacy multiplayer projects. Browse, copy a link, translate the names or add icons.">
<link rel="stylesheet" href="/catalog.css">
</head>
<body>
<a class="skip" id="skip" href="#grid" data-t="skip">Skip to icons</a>
<header>
  <button class="btn" id="toggle" type="button" aria-expanded="false" aria-controls="side" data-t="folders">Folders</button>
  <h1><span id="title">Icon Catalog</span><span id="total"></span></h1>
  <input id="q" type="search" aria-label="Search icons" placeholder="Search" autocomplete="off">
  <div class="tools" id="tools"></div>
  <a class="contact" href="https://discord.com/users/317004664002576386" target="_blank" rel="noopener"><span data-t="contact">Contact me:</span> <b>denizwp</b></a>
</header>
<div class="tbar" id="tbar" hidden></div>
<div class="wrap">
  <aside id="side"><ul id="tree"></ul></aside>
  <main id="main" tabindex="-1">
    <a class="banner" href="https://heylatch.app/" target="_blank" rel="noopener sponsored"><img src="https://cdn.heylatch.app/brand/banner-forum-2400x400.png" alt="Latch" width="2400" height="400"></a>
    <div class="bar" id="bar"><div class="crumbs" id="crumbs"></div><span class="count" id="count"></span><span class="legend" id="legend"></span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden data-t="none">No results.</div>
    <div id="more"></div>
  </main>
</div>
<footer id="foot"></footer>
<dialog id="dlg">
  <div class="dlg">
    <div class="dlg-top">
      <h2 id="d-title"></h2>
      <button class="icon-btn" id="d-prev" type="button" data-t-label="prev" aria-label="Previous" title="Previous (←)">&#8592;</button>
      <button class="icon-btn" id="d-next" type="button" data-t-label="next" aria-label="Next" title="Next (→)">&#8594;</button>
      <button class="icon-btn" id="d-close" type="button" data-t-label="close" aria-label="Close" title="Close (Esc)">&#10005;</button>
    </div>
    <div class="stage"><img id="d-img" alt=""><span class="dim" id="d-dim"></span></div>
    <div class="rows">
      <div class="row"><label for="d-url" data-t="url">URL</label><input id="d-url" readonly><button type="button" data-copy="d-url" data-t="copy">Copy</button></div>
      <div class="row"><label for="d-path" data-t="path">Path</label><input id="d-path" readonly><button type="button" data-copy="d-path" data-t="copy">Copy</button></div>
      <div class="row"><label for="d-name" data-t="name">Name</label><input id="d-name" readonly><button type="button" data-copy="d-name" data-t="copy">Copy</button></div>
    </div>
    <div class="dlg-foot"><span id="d-pos"></span><a id="d-open" target="_blank" rel="noopener" data-t="openTab">Open in new tab</a></div>
  </div>
</dialog>
<dialog id="help"><div class="dlg text" id="help-body"></div></dialog>
<dialog id="send"><div class="dlg text" id="send-body"></div></dialog>
<script src="/catalog.js"></script>
</body>
</html>
